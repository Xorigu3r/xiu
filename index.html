<script>
// Versió web: el service worker (sw.js, el crea scripts/web.mjs) la fa funcionar sense connexió.
// A l'APK (Capacitor) i a l'escriptori (Electron) no cal: ja ho porten tot dins.
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform()) && !window.xiuEscriptori) {
  // si arriba una versió nova (el service worker nou pren el control), l'app ho diu i demana actualitzar
  const habiaControl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (habiaControl) dispatchEvent(new Event('xiu-nova-versio')); });
  navigator.serviceWorker.register('sw.js').then((r) => { setInterval(() => r.update().catch(() => {}), 3600e3); }).catch(() => {});
}
</script>
